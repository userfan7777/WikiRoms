<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<title>PlayStation Vita · LiveArea</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  font-family: "Segoe UI", Arial, sans-serif;
  background: linear-gradient(#0b3b78, #0a2e5a);
  overflow: hidden;
}

/* HEADER */
header {
  color: white;
  padding: 18px 30px;
  font-size: 22px;
  font-weight: 600;
}

/* SCROLL AREA */
#scroll {
  height: calc(100% - 70px);
  overflow-y: auto;
  padding: 20px 30px;
}

/* GRID */
#grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 28px;
}

/* CARD */
.game {
  background: rgba(255,255,255,0.08);
  border-radius: 14px;
  text-align: center;
  cursor: pointer;
  transition: transform .15s ease, box-shadow .15s ease;
}

.game:hover {
  transform: scale(1.07);
  box-shadow: 0 12px 30px rgba(0,0,0,.5);
}

.game img {
  width: 100%;
  height: 240px;
  object-fit: cover;
  border-radius: 14px 14px 0 0;
  background: #111;
}

.game span {
  display: block;
  color: white;
  font-size: 13px;
  padding: 8px 6px 12px;
}

/* SCROLLBAR (tipo consola) */
#scroll::-webkit-scrollbar {
  width: 10px;
}
#scroll::-webkit-scrollbar-thumb {
  background: rgba(255,255,255,.3);
  border-radius: 10px;
}
</style>
</head>

<body>

<header>PlayStation Vita · LiveArea</header>

<div id="scroll">
  <div id="grid"></div>
</div>

<script>
fetch("games.json")
.then(r => r.json())
.then(games => {
  const grid = document.getElementById("grid");

  games.forEach(g => {
    const div = document.createElement("div");
    div.className = "game";

    const img = document.createElement("img");
    img.src = g.cover;
    img.onerror = () => img.src = "default.png";

    const name = document.createElement("span");
    name.textContent = g.name;

    div.appendChild(img);
    div.appendChild(name);
    grid.appendChild(div);
  });
})
.catch(err => console.error("ERROR cargando games.json", err));
</script>

</body>
</html>
